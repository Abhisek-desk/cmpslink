services:
  mongodb:
    image: mongo:7
    container_name: campuslink-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - campuslink_mongo:/data/db

  backend:
    build: ./backend
    environment:
      MONGO_URI: mongodb://mongodb:27017/campuslink
      JWT_SECRET: change_me
      PORT: 5000
      CLIENT_URL: http://localhost:5173
      AI_SERVICE_URL: http://ai:8000
    ports:
      - "5000:5000"
    depends_on:
      - mongodb
      - ai

  ai:
    build: ./ai
    ports:
      - "8000:8000"

volumes:
  campuslink_mongo:
